name: Octonaut
options:
  bundleIdPrefix: com.ledwardchow
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Octonaut:
    type: application
    platform: iOS
    sources:
      - path: OctonautApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledwardchow.Octonaut
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Octonaut
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: OctonautApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.ledwardchow.Octonaut
            CFBundleURLSchemes:
              - octonaut
    scheme:
      gatherCoverageData: true
      testTargets:
        - OctonautTests
  OctonautTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OctonautTests
    dependencies:
      - target: Octonaut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ledwardchow.OctonautTests
        GENERATE_INFOPLIST_FILE: YES
